<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Thalaivaa - Interactive Mobile Phone Simulator & Genuine Flutter App Shell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #FF6B00;
  --bg-app: #0B0F17;
  --sim-scale: 1;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

body {
  background: radial-gradient(circle at 50% 20%, #1A2333 0%, #0B0F17 100%);
  color: #F8FAFC;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

/* Studio Header / Toolbar */
.studio-bar {
  width: 100%;
  max-width: 1200px;
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  z-index: 100;
}

.studio-brand { display: flex; align-items: center; gap: 12px; }
.brand-badge {
  background: linear-gradient(135deg, #FF6B00, #FFA500);
  color: white; font-weight: 900; font-size: 18px; width: 40px; height: 40px;
  border-radius: 12px; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px rgba(255, 107, 0, 0.4);
}
.brand-title { font-size: 18px; font-weight: 800; color: #FFFFFF; }
.brand-sub { font-size: 11px; color: #94A3B8; font-weight: 500; }

.controls-group { display: flex; align-items: center; gap: 12px; }
.control-btn {
  background: #1E293B; color: #CBD5E1; border: 1px solid #334155; padding: 8px 14px;
  border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px;
}
.control-btn:hover { background: #334155; color: white; }
.control-btn.active { background: #FF6B00; border-color: #FF6B00; color: white; }

.device-select {
  background: #1E293B; color: white; border: 1px solid #334155; padding: 8px 12px;
  border-radius: 10px; font-size: 12px; font-weight: 700; outline: none; cursor: pointer;
}

/* Phone Stage */
.sim-stage { flex: 1; width: 100%; display: flex; justify-content: center; align-items: center; padding: 30px 20px; }

.phone-chassis {
  position: relative; width: 390px; height: 830px; background: #1E222B; border-radius: 54px; padding: 12px;
  box-shadow: 0 0 0 2px #3E4554, 0 0 0 6px #1A1D24, 0 30px 80px rgba(0, 0, 0, 0.8);
  display: flex; flex-direction: column; transform: scale(var(--sim-scale)); transition: all 0.3s ease;
}

.side-btn { position: absolute; background: #2D3340; border-radius: 3px; cursor: pointer; }
.side-btn:hover { background: #FF6B00; }
.btn-action { left: -14px; top: 115px; width: 4px; height: 26px; }
.btn-vol-up { left: -14px; top: 160px; width: 4px; height: 50px; }
.btn-vol-down { left: -14px; top: 222px; width: 4px; height: 50px; }
.btn-power { right: -14px; top: 180px; width: 4px; height: 75px; }

.phone-screen {
  position: relative; width: 100%; height: 100%; background: #0B0F17; border-radius: 44px; overflow: hidden;
}

/* Genuine Flutter Web Application Entry Container */
.flutter-iframe {
  width: 100%; height: 100%; border: none; border-radius: 44px; position: absolute; inset: 0; background: #0B0F17; z-index: 10;
}
</style>
</head>
<body>

<header class="studio-bar">
  <div class="studio-brand">
    <div class="brand-badge">📱</div>
    <div>
      <div class="brand-title">Thalaivaa Phone Simulator</div>
      <div class="brand-sub">Native Flutter Web Application Container</div>
    </div>
  </div>

  <div class="controls-group">
    <button class="control-btn active" onclick="reloadFlutterApp()">🔄 Reload Flutter App</button>
    <select class="device-select" onchange="switchDeviceModel(this.value)">
      <option value="iphone16">iPhone 16 Pro</option>
      <option value="pixel9">Pixel 9 Pro</option>
      <option value="galaxy24">Galaxy S24 Ultra</option>
    </select>
    <a href="/flutter_web/" target="_blank" class="control-btn" style="text-decoration:none; background:#FF6B00; color:white; border:none;">
      🚀 Open Fullscreen Flutter Web ↗
    </a>
  </div>
</header>

<main class="sim-stage">
  <div class="phone-chassis" id="device-frame">
    <div class="side-btn btn-action" title="Action Button" onclick="reloadFlutterApp()"></div>
    <div class="side-btn btn-vol-up" title="Volume Up"></div>
    <div class="side-btn btn-vol-down" title="Volume Down"></div>
    <div class="side-btn btn-power" title="Power / Lock Screen"></div>

    <div class="phone-screen">
      <!-- Genuine Flutter Web Application Entry Container -->
      <iframe id="flutter-viewport-iframe" class="flutter-iframe" src="/flutter_web/index.html"></iframe>
    </div>
  </div>
</main>

<script>
function reloadFlutterApp() {
  const iframe = document.getElementById('flutter-viewport-iframe');
  if (iframe) iframe.src = '/flutter_web/index.html?t=' + Date.now();
}

function switchDeviceModel(model) {
  const frame = document.getElementById('device-frame');
  if (model === 'iphone16') {
    frame.style.width = '390px'; frame.style.height = '830px'; frame.style.borderRadius = '54px';
  } else if (model === 'pixel9') {
    frame.style.width = '412px'; frame.style.height = '850px'; frame.style.borderRadius = '48px';
  } else if (model === 'galaxy24') {
    frame.style.width = '430px'; frame.style.height = '870px'; frame.style.borderRadius = '32px';
  }
}
</script>
</body>
</html>
