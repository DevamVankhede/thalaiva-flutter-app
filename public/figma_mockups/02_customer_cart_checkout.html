<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thalaivaa - Cart & Checkout (Figma Prototype)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
body { background: #0F172A; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
.device-frame { width: 390px; height: 844px; background: #F8F9FA; border-radius: 40px; box-shadow: 0 25px 60px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column; border: 8px solid #334155; }
.header { background: white; padding: 20px 16px 12px; border-bottom: 1px solid #E2E8F0; display: flex; justify-content: space-between; align-items: center; }
.header h2 { font-size: 18px; font-weight: 800; color: #1E1E2E; }
.content { flex: 1; overflow-y: auto; padding: 16px; }
.delivery-toggle { background: #E2E8F0; border-radius: 12px; padding: 4px; display: flex; margin-bottom: 16px; }
.toggle-btn { flex: 1; padding: 10px; border-radius: 10px; text-align: center; font-size: 13px; font-weight: 700; cursor: pointer; }
.toggle-btn.active { background: #FF6B00; color: white; }
.card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.card-title { font-size: 14px; font-weight: 700; color: #1E1E2E; margin-bottom: 12px; }
.item-row { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #F1F5F9; margin-bottom: 12px; }
.stepper { display: flex; align-items: center; gap: 8px; background: #FFF7ED; border: 1px solid #FF6B00; border-radius: 8px; padding: 4px 8px; font-weight: 700; color: #FF6B00; font-size: 13px; }
.bill-row { display: flex; justify-content: space-between; font-size: 13px; color: #64748B; margin-bottom: 8px; }
.bill-row.total { font-size: 16px; font-weight: 800; color: #1E1E2E; border-top: 1px solid #E2E8F0; padding-top: 10px; margin-top: 8px; }
.checkout-bar { background: white; padding: 16px; border-top: 1px solid #E2E8F0; display: flex; justify-content: space-between; align-items: center; }
.pay-btn { background: #FF6B00; color: white; border: none; padding: 14px 24px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<div class="device-frame">
  <div class="header">
    <h2>Checkout & Bill Receipt</h2>
    <span style="font-size: 12px; color: #EF4444; font-weight: 600;">Clear All</span>
  </div>
  <div class="content">
    <div class="delivery-toggle">
      <div class="toggle-btn active">🛵 Home Delivery</div>
      <div class="toggle-btn">🛍️ Pickup</div>
    </div>
    <div class="card">
      <div class="card-title">Order Items</div>
      <div class="item-row">
        <div>
          <div style="font-weight: 700; font-size: 14px;">Ghee Roast Masala Dosa</div>
          <div style="font-size: 11px; color: #64748B;">+ Extra Ghee Topping</div>
          <div style="color: #FF6B00; font-weight: 700; font-size: 13px; margin-top: 2px;">₹210</div>
        </div>
        <div class="stepper"><span>-</span><span>1</span><span>+</span></div>
      </div>
      <div class="item-row" style="border-bottom: none; margin-bottom: 0;">
        <div>
          <div style="font-weight: 700; font-size: 14px;">Authentic Filter Kaapi</div>
          <div style="color: #FF6B00; font-weight: 700; font-size: 13px; margin-top: 2px;">₹140</div>
        </div>
        <div class="stepper"><span>-</span><span>2</span><span>+</span></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Bill Breakdown</div>
      <div class="bill-row"><span>Item Subtotal</span><span style="font-weight: 600; color: #1E1E2E;">₹350.00</span></div>
      <div class="bill-row"><span>GST (5%)</span><span style="font-weight: 600; color: #1E1E2E;">₹17.50</span></div>
      <div class="bill-row"><span>Delivery Partner Fee</span><span style="color: #10B981; font-weight: 700;">FREE</span></div>
      <div class="bill-row"><span>Promo (THALAIVAA50)</span><span style="color: #10B981; font-weight: 700;">-₹50.00</span></div>
      <div class="bill-row total"><span>To Pay</span><span style="color: #FF6B00;">₹317.50</span></div>
    </div>
  </div>
  <div class="checkout-bar">
    <div>
      <div style="font-size: 10px; color: #64748B; font-weight: 700;">GRAND TOTAL</div>
      <div style="font-size: 20px; font-weight: 800; color: #FF6B00;">₹317.50</div>
    </div>
    <button class="pay-btn">Place Order ➔</button>
  </div>
</div>
</body>
</html>
